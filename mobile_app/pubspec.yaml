name: mobile_app
description: "KumbhRaksha — missing person search & reunion for Kumbh Mela pilgrims."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State management (per global standards)
  provider: ^6.1.2

  # Models / equality
  equatable: ^2.0.5

  # BLE + permissions
  flutter_blue_plus: ^1.32.12
  permission_handler: ^11.3.1

  # Location
  geolocator: ^13.0.1

  # Local storage
  shared_preferences: ^2.3.2
  flutter_secure_storage: ^9.2.2
  sqflite: ^2.3.3+1
  path: ^1.9.0

  # Networking
  dio: ^5.7.0

  # Media
  image_picker: ^1.1.2

  # Real-time
  web_socket_channel: ^3.0.1

  # Utilities
  uuid: ^4.5.1
  logger: ^2.4.0
  intl: ^0.19.0
  google_fonts: ^6.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
